[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-hard-print"
version = "0.4.1"
authors = [
  { name="Erik Bergsten", email="erikbergsten94@gmail.com" },
]
description = "Make PDFs from markdown"
requires-python = ">=3.8"
dependencies = [
  "weasyprint",
  "mistune>=3.2.0",
  "beautifulsoup4>=4.15.0",
  "jinja2>=3.1.6",
  "pygal>=3.1.3",
  "pyyaml>=6.0.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
omega-hard-print = "omega_hard_print.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["omega_hard_print"]
